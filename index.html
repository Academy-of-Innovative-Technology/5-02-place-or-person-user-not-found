<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Person Profiler</title>

    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-4">
        <header class="mb-4 text-center">
            <h1 class="h3">Person Profiler</h1>
            <p class="lead">Type a name and click Search to show the person’s profile.</p>
        </header>

        <div class="search-section mb-3">
            <input type="text" id="country" class="form-control" placeholder="Enter person name">
            <button id="search-btn" class="btn btn-primary mt-2">Search</button>
        </div>

        <div id="results"></div>
    </div>
    <script src="bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
