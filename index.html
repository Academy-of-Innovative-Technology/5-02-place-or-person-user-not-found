<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country / Person Profiler</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-4">
        <header class="mb-4">
            <h1 class="h3">Country & Person Profiler</h1>
            <p class="lead">Type a name to see options, click Search to show matching entries.</p>
        </header>

        <div class="search-section">
            <input type="text" id="country" class="form-control" placeholder="Search by name">
            <button id="search-btn" class="btn btn-primary mt-2">Search</button>
        </div>

        <div id="suggestions-list" class="suggestions d-none mt-3"></div>
        <div id="results" class="mt-3"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
